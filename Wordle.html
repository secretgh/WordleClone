<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WR Career Expo Wordle</title>
        <!--<link rel="stylesheet" href="styles.css">-->
        <style>
            :root {
                --word-size: 5;
            }

            body {
                font-family: Arial, sans-serif;
                text-align: center;
                background-color: #f0f0f0;
            }

            #gameboard {
                display: grid;
                grid-template-columns: repeat(var(--word-size), 1fr);
                gap: 10px;
                margin: 20px auto;
                max-width: fit-content;
            }
            .cell {
                width: 60px;
                height: 60px;
                border: 2px solid #333;
                text-align: center;
                line-height: 60px;
                font-size: 2em;
            }
            .cell.correct {
                background: #538d4e;
                color: white;
            }
            .cell.semi-correct {
                background: #b59f3b;
                color: white;
            }
            .cell.incorrect {
                background: #3a3a3c;
                color: white;
            }
            @media (max-width: 400px) {
            .cell {
                width: 40px;
                height: 40px;
                border: 1px solid #333;
                text-align: center;
                line-height: 40px;
                font-size: 1em;
            }
            }
        </style>
    </head>
    <body>
        <h1>Booth #? - Wind River Wordle</h1>
        <p>
            Please look and listen closely at the booth to get hints towards the word. <br>
            The employee with the least amount of guesses gets a trophy...
        </p>
        <p style="line-height:24px;">
           <span style="padding: 2px; margin-bottom:2px; background:#538d4e;color:white; border-radius: 2px;">Green</span> is in the word and in the correct spot. <br>
           <span style="padding: 2px; margin-bottom:2px; background:#b59f3b;color:white; border-radius: 2px;">Yellow</span> is in the word but in the wrong spot. <br>
           <span style="padding: 2px; margin-bottom:2px; background:#3a3a3c; color:white; border-radius:2px;">Grey</span> is not in the word in any spot.
        </p>
        <div id="gameboard"></div>
        <input type="text" id="guess">
        <button id="btnGuess">Guess</button>
        <!--<script src="script.js"></script>-->
        <script>
            const gameBoard = document.getElementById('gameboard');
            const guessInput = document.getElementById('guess');
            const guessButton = document.getElementById('btnGuess');
            let solutionWord = 'Whatintheworld';
            const inputs = [];
            const results = [];
            const wordSize = solutionWord.length;
            const attempts = 5;

            document.documentElement.style.setProperty('--word-size', wordSize)
            guessInput.maxLength = wordSize;

            function validate(word) {
                let result = [];
                let tempSolution = solutionWord.toLowerCase();
                for (let index = 0; index < wordSize; index++) {
                    if(word[index] === tempSolution[index])
                    {
                        result.push('yes')
                        tempSolution = tempSolution.replace(word[index], ' ')
                    }
                    else if (tempSolution.includes(word[index]))
                    {
                        result.push('maybe')
                        tempSolution = tempSolution.replace(word[index], ' ')
                    }
                    else{
                        result.push(word[index])
                    }

                }
                console.log(result)
                inputs.push(word);
                results.push(result);
                guessInput.value = "";
                refreshGame();
                if(result.toString().replaceAll(',','') === "yes".repeat(wordSize)){
                    guessInput.disabled = true;
                    guessButton.disabled = true;
                }
            }
            // update game UI
            function refreshGame() {
            const cells = gameBoard.getElementsByClassName('cell');
                for (let i = 0; i < wordSize*attempts; i++) {
                    let cell = cells[i];
                    let y = Math.floor(i / wordSize);
                    let x = i - y * wordSize;
                    if(inputs.length > y && inputs[y][x]) {
                        const result = results[y][x] === "yes" ? "correct" : results[y][x] === "maybe" ? "semi-correct" : "incorrect";
                        cell.textContent = inputs[y][x].toUpperCase();
                        cell.classList.add(result);
                    }
                }
            }
            // Initialize game
            function initializeGame() {
                for (let i = 0; i < wordSize*attempts; i++) { // 6 attempts, 5 letters each
                    let cell = document.createElement('div');
                    cell.classList.add('cell');
                    let y = Math.floor(i / wordSize);
                    let x = i - y * wordSize;
                    if(inputs.length > y && inputs[y][x]) {
                        const result = results[y][x] === "yes" ? "correct" : results[y][x] === "maybe" ? "semi-correct" : "incorrect";
                        cell.textContent = inputs[y][x].toUpperCase();
                        cell.classList.add(result);
                    }
                    gameBoard.appendChild(cell);
                }
            }
            // Event listener for the guess button
            guessButton.addEventListener('click', function() {
                let guess = guessInput.value.toLowerCase();
                if (guess.length === wordSize) {
                    validate(guess)
                } else {
                    alert('Please enter a '+wordSize+'-letter word.');
                }
            });
            initializeGame();
        </script>
    </body>
</html>
